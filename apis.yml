name: Zudo
description: Zudo builds AI-powered agents purpose-built for the warranty industry, automating
  customer service and back-office operations for home warranty, auto warranty, and OEM
  third-party administrators. Its agents (Adam for customer service, Emma for operations)
  handle claim follow-ups, initiations, and authorizations around the clock to improve
  warranty customer experience and operating margins. Surfaced as a portfolio company of
  Kindred Ventures and added to the API Evangelist network; the public site is marketing-only
  with no developer/API surface published at enrichment time.
